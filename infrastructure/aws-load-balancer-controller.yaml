# ---------------------------------------------------------------------------
# AWS Load Balancer Controller.
#
# Що робить: бачить у кластері Service типу LoadBalancer зі своїм класом
# і створює під нього Network Load Balancer в AWS. Далі тримає NLB
# у відповідності до сервісу: змінились поди — змінились цілі балансувальника.
#
# Доступ до AWS — через Pod Identity (роль і асоціація: cluster/platform-iam.tf).
# ---------------------------------------------------------------------------
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "3.5.0"              # версію закріплено, як і все в цьому репозиторії
      sourceRef:
        kind: HelmRepository
        name: eks-charts

  # Сам об'єкт HelmRelease живе у flux-system, а чарт ставиться в kube-system.
  targetNamespace: kube-system

  # Ім'я релізу задаємо явно. Без цього Flux склав би його як
  # <targetNamespace>-<name> = kube-system-aws-load-balancer-controller,
  # і чарт згенерував би службовий акаунт з іншим ім'ям, ніж у Pod Identity.
  releaseName: aws-load-balancer-controller

  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    # ${...} підставляє Flux із postBuild.substitute (cluster/flux-infrastructure.tf).
    # Контролер може визначити VPC і регіон сам через метадані вузла,
    # але явні значення прибирають цілий клас помилок на старті.
    clusterName: ${CLUSTER_NAME}
    region: ${AWS_REGION}
    vpcId: ${VPC_ID}

    serviceAccount:
      create: true
      name: aws-load-balancer-controller   # = service_account у Pod Identity

    # У продакшні 2 репліки для відмовостійкості. Нам вистачить однієї.
    replicaCount: 1

    # Чарт за замовчуванням не задає ресурсів — задаємо, щоб планувальник
    # знав реальний апетит пода. Числа — з запасом для навчального кластера.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    # Вебхук, що робить цей контролер «за замовчуванням» для ВСІХ нових
    # Service типу LoadBalancer, вимикаємо. Причина: він має
    # failurePolicy: Fail і спрацьовує на створення будь-якого Service —
    # поки поди контролера не працюють (а між заняттями вузли в нулі),
    # такі запити відхилялись би. Замість нього клас балансувальника
    # вказуємо в сервісі явно: spec.loadBalancerClass: service.k8s.aws/nlb.
    enableServiceMutatorWebhook: false
